{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>


    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card animate-login">
        <h3 class="text-center mb-4">
            <i class="bi bi-person-plus me-2"></i>Create Account
        </h3>
        {% if messages %}
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
            {% for message in messages %}
            <div class="toast align-items-center text-bg-{{ message.tags }} border-0 show mb-2"
                style="background-color: #9263b8;"
                role="alert"
                aria-live="assertive"
                aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body animate-alert">
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast"></button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password1" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="#" class="text-white fw-semibold">Login</a>
        </p>
    </div>
</div>
<script>
        document.querySelectorAll('.toast').forEach(toast => {
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    });
</script>
</body>
</html>
