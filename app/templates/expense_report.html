{% extends "home_page.html" %}
{% load static %}

{% block content %}
<style>

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-weight: 700;
            font-size: 2.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .total-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .total-card:hover {
            transform: translateY(-10px);
        }
        .total-card h5 {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        .total-card h2 {
            font-size: 3rem;
            font-weight: 700;
            margin: 0;
        }
        .chart-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .chart-card:hover {
            transform: translateY(-10px);
        }
        .chart-card h5 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.4rem;
        }
        canvas {
            max-height: 400px;
        }

        .hero{
            height: auto;
        }
</style>

<!-- Hero Section -->
<section class="hero justify-content-start pt-5">
    <div class="container">
        <h1>Expense Dashboard</h1>
    
        <!-- This Month Total Card -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-5 col-sm-8">
                <div class="total-card">
                    <h5>This Month Total</h5>
                    <h2>${{ this_month_total }}</h2>
                </div>
            </div>
        </div>
    
        <!-- Charts -->
        <div class="row justify-content-center">
            <!-- Pie Chart -->
            <div class="col-lg-5 col-md-6 mb-4">
                <div class="chart-card">
                    <h5>This Month by Category</h5>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
    
            <!-- Bar Chart -->
            <div class="col-lg-6 col-md-8 mb-4">
                <div class="chart-card">
                    <h5>This Year Monthly Totals</h5>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
</section>
<script src="{% static './js/jquery.js' %}"></script>
<script>
    // Convert Django dicts into JS objects
    const categoryTotals = {{ category_totals|safe }};
    const monthTotals = {{ month_totals|safe }};

    // --- Pie / Doughnut Chart ---
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    new Chart(pieCtx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(categoryTotals),
            datasets: [{
                data: Object.values(categoryTotals),
                backgroundColor: [
    '#FF6B6B',
    '#4ECDC4',
    '#45B7D1',
    '#96CEB4',
    '#FECA57',
    '#DDA0DD'
],
                borderWidth: 0,
                hoverOffset: 15
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { color: '#fff', font: { size: 14 } }
                }
            }
        }
    });

    // --- Bar Chart ---
    const barCtx = document.getElementById('barChart').getContext('2d');
    new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: Object.keys(monthTotals),
            datasets: [{
                label: 'Expenses This Year',
                data: Object.values(monthTotals),
                backgroundColor: 'rgba(79, 195, 247, 0.6)',
                borderColor: '#4FC3F7',
                borderWidth: 1,
                borderRadius: 10,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { color: '#fff' },
                    grid: { color: 'rgba(255,255,255,0.1)' }
                },
                x: {
                    ticks: { color: '#fff' },
                    grid: { color: 'rgba(255,255,255,0.1)' }
                }
            }
        }
    });
</script>
{% endblock %}
